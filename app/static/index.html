<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGIP Operator Dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css?v=20260527-operator" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="AGIP navigation">
        <a class="brand" href="#overview" data-view="overview" aria-label="AGIP overview">
          <span class="brand-mark" aria-hidden="true">◇</span>
          <span>
            <strong>AGIP</strong>
            <small>Agentic Governance Intelligence Platform</small>
          </span>
        </a>

        <nav class="nav-stack">
          <p class="nav-label">Operator Console</p>
          <button class="nav-item active" data-view="overview"><span>⌂</span>Governance Overview</button>
          <button class="nav-item" data-view="agents"><span>◎</span>Agents</button>
          <button class="nav-item" data-view="tools"><span>⌘</span>Tool Gateway</button>
          <button class="nav-item" data-view="policies"><span>◫</span>Policy Decisions</button>
          <button class="nav-item" data-view="incidents"><span>△</span>Incidents</button>
          <button class="nav-item" data-view="regression"><span>▱</span>Regression Lab</button>
          <button class="nav-item" data-view="audit"><span>≣</span>Audit Explorer</button>
          <button class="nav-item" data-view="openapi"><span>{ }</span>OpenAPI Console</button>
          <button class="nav-item" data-view="observability"><span>⌁</span>Observability</button>
        </nav>

        <div class="operator-card">
          <div class="avatar">DD</div>
          <div>
            <strong>Daniel Danek</strong>
            <small>Platform Operator</small>
            <span class="online-dot">Online</span>
          </div>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <div class="title-row">
              <h1 id="view-title">Governance Overview</h1>
              <span class="version-pill">v2.1</span>
            </div>
            <p id="view-subtitle">Monitor governed agents, scoped tools, policy decisions and runtime evidence.</p>
          </div>
          <div class="topbar-actions">
            <div class="status-strip" aria-label="System status">
              <span>Environment <b id="env-value">local</b></span>
              <span>Policy <b id="policy-value">loading</b></span>
              <span>Health <b id="health-value">checking</b></span>
            </div>
            <label class="search-box">
              <span>⌕</span>
              <input id="global-search" type="search" placeholder="Search agents, incidents, policies..." />
            </label>
            <button class="icon-button" id="refresh-button" type="button" aria-label="Refresh dashboard">↻</button>
            <a class="docs-button" href="/docs">API Docs</a>
          </div>
        </header>

        <section class="metric-grid" id="metric-grid" aria-label="AGIP metrics"></section>
        <section class="view-grid" id="view-grid" aria-live="polite"></section>
      </main>
    </div>

    <script src="/static/dashboard.js?v=20260527-operator"></script>
  </body>
</html>
